name: Sync upstream

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'anomaly51/telegram-SwearModeration-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream code and preserve local CI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/sync_upstream.py
      - name: Ensure CI runs for the synchronized main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A GITHUB_TOKEN push does not trigger another push workflow.
          # Checking existing runs also recovers a failed dispatch on the next schedule.
          python3 - <<'PY'
          import json, subprocess
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          runs = json.loads(subprocess.check_output([
              'gh', 'run', 'list', '--workflow', 'ci.yml', '--branch', 'main',
              '--commit', sha, '--limit', '1', '--json', 'databaseId']))
          if not runs:
              subprocess.run(['gh', 'workflow', 'run', 'ci.yml', '--ref', 'main'], check=True)
              print('Started CI for synchronized main:', sha)
          else:
              print('CI already exists for main:', sha)
          PY
